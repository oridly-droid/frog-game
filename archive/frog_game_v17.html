<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>青蛙守卫池塘 v17 角色升级版</title>

<style>
body{
margin:0;
background:#07131d;
color:white;
font-family:sans-serif;
text-align:center;
}

canvas{
background:radial-gradient(circle,#0a2b3a,#04151f);
display:block;
margin:auto;
}

#ui{
position:absolute;
top:10px;
left:10px;
font-size:14px;
text-align:left;
}
</style>
</head>

<body>

<h2>🐸 青蛙守卫池塘 v17 角色升级版</h2>

<div id="ui">
WASD / 方向键移动<br>
鼠标发射泡泡
</div>

<canvas id="game" width="900" height="600"></canvas>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

const frog = {
x:450,
y:300,
vx:0,
vy:0
}

const enemies=[]

function spawnEnemy(){

const types=["fly","mosquito","beetle","wasp"]

const t=types[Math.floor(Math.random()*types.length)]

enemies.push({
x:Math.random()*900,
y:-40,
type:t,
vy:1+Math.random()*1.5
})

}

setInterval(spawnEnemy,1500)

const keys={}

document.addEventListener("keydown",e=>keys[e.key]=true)
document.addEventListener("keyup",e=>keys[e.key]=false)

function update(){

if(keys["w"]||keys["ArrowUp"])frog.y-=4
if(keys["s"]||keys["ArrowDown"])frog.y+=4
if(keys["a"]||keys["ArrowLeft"])frog.x-=4
if(keys["d"]||keys["ArrowRight"])frog.x+=4

enemies.forEach(e=>{
e.y+=e.vy
})

}

function drawFrog(){

ctx.save()

ctx.translate(frog.x,frog.y)

ctx.fillStyle="#46c35a"

ctx.beginPath()
ctx.ellipse(0,0,26,20,0,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="#b7f5b2"
ctx.beginPath()
ctx.ellipse(0,5,14,10,0,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="#2c8f3e"
ctx.beginPath()
ctx.arc(-10,-3,4,0,Math.PI*2)
ctx.arc(8,-6,3,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="white"
ctx.beginPath()
ctx.arc(-10,-14,7,0,Math.PI*2)
ctx.arc(10,-14,7,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="black"
ctx.beginPath()
ctx.arc(-10,-14,3,0,Math.PI*2)
ctx.arc(10,-14,3,0,Math.PI*2)
ctx.fill()

ctx.strokeStyle="#1f6f2c"
ctx.lineWidth=2
ctx.beginPath()
ctx.arc(0,5,8,0.2,Math.PI-0.2)
ctx.stroke()

ctx.restore()

}

function drawEnemy(e){

ctx.save()
ctx.translate(e.x,e.y)

if(e.type==="fly"){

ctx.fillStyle="#7a4a24"
ctx.beginPath()
ctx.ellipse(0,0,12,8,0,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="rgba(255,255,255,0.6)"
ctx.beginPath()
ctx.ellipse(-6,-6,8,3,0.5,0,Math.PI*2)
ctx.ellipse(6,-6,8,3,-0.5,0,Math.PI*2)
ctx.fill()

}

if(e.type==="mosquito"){

ctx.strokeStyle="#ccc"
ctx.beginPath()
ctx.moveTo(0,0)
ctx.lineTo(16,-10)
ctx.stroke()

ctx.fillStyle="#555"
ctx.beginPath()
ctx.arc(0,0,6,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="red"
ctx.beginPath()
ctx.arc(3,-1,2,0,Math.PI*2)
ctx.fill()

}

if(e.type==="beetle"){

ctx.fillStyle="#4a2b16"
ctx.beginPath()
ctx.ellipse(0,0,14,10,0,0,Math.PI*2)
ctx.fill()

ctx.strokeStyle="#caa472"
ctx.beginPath()
ctx.moveTo(0,-10)
ctx.lineTo(0,10)
ctx.stroke()

}

if(e.type==="wasp"){

ctx.fillStyle="#fbbf24"
ctx.beginPath()
ctx.ellipse(0,0,14,8,0,0,Math.PI*2)
ctx.fill()

ctx.strokeStyle="#78350f"
ctx.beginPath()
ctx.moveTo(-10,0)
ctx.lineTo(10,0)
ctx.stroke()

}

ctx.restore()

}

function render(){

ctx.clearRect(0,0,900,600)

drawFrog()

enemies.forEach(drawEnemy)

}

function loop(){

update()
render()

requestAnimationFrame(loop)

}

loop()

</script>

</body>
</html>
