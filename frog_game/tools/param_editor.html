<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青蛙乐园 参数编辑器</title>
<link rel="stylesheet" href="./param_editor.css">
</head>
<body>
<div class="editor-shell">
    <aside class="sidebar">
        <div class="brand">
            <h1>参数编辑器</h1>
            <p>Player / Enemy v1</p>
        </div>
        <nav id="section-nav" class="section-nav"></nav>
        <div class="sidebar-note">
            <h2>说明</h2>
            <p>本页会把修改写入 `dev_overrides/*.override.json`。</p>
            <p>默认值源码不会被直接覆盖，刷新游戏页即可读取 override 生效。</p>
        </div>
    </aside>

    <main class="main-panel">
        <header class="toolbar">
            <div>
                <h2 id="panel-title">参数面板</h2>
                <p id="panel-subtitle">读取默认配置并叠加 override，支持自动保存到项目文件。</p>
            </div>
            <div class="toolbar-actions">
                <button id="bind-directory-button" type="button">绑定配置目录</button>
                <button id="apply-button" type="button">立即保存</button>
                <button id="clear-override-button" type="button" class="ghost">清空 override</button>
                <button id="reset-button" type="button" class="ghost">重置当前面板</button>
                <button id="export-button" type="button" class="ghost">导出配置</button>
                <button id="copy-button" type="button" class="ghost">复制 JSON</button>
            </div>
        </header>

        <section class="status-row">
            <div class="status-stack">
                <div id="status-message" class="status-message">已加载当前配置。</div>
                <div class="meta-row">
                    <span id="binding-status" class="meta-pill">未绑定配置目录</span>
                    <span id="source-status" class="meta-pill">来源：默认配置</span>
                    <label class="toggle-pill">
                        <input id="autosave-toggle" type="checkbox" checked>
                        <span>自动保存</span>
                    </label>
                </div>
            </div>
            <a class="game-link" href="/frog_game/index.html" target="_blank" rel="noopener noreferrer">打开游戏页</a>
        </section>

        <section id="content-root" class="content-root"></section>

        <section class="import-export-panel">
            <div class="import-header">
                <h3>导入 / 导出 JSON</h3>
                <button id="import-button" type="button">从 JSON 导入</button>
            </div>
            <textarea id="json-area" spellcheck="false" placeholder="这里会显示导出的 JSON，也可以粘贴 JSON 后点击“从 JSON 导入”。"></textarea>
        </section>

        <section class="future-rules">
            <h3>后续扩展硬约束</h3>
            <ul id="future-rules-list"></ul>
        </section>
    </main>
</div>

<script type="module" src="./param_editor.js"></script>
</body>
</html>
