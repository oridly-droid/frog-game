<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10251d" />
  <title>青蛙游戏选择</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 22% 18%, rgba(140, 236, 170, 0.18), transparent 28%),
        radial-gradient(circle at 78% 12%, rgba(125, 211, 252, 0.14), transparent 25%),
        linear-gradient(160deg, #10251d 0%, #07120f 56%, #162019 100%);
      color: #f4fff8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    main {
      width: min(100%, 880px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #a7f3d0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 68px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .intro {
      max-width: 620px;
      margin: 18px 0 30px;
      color: rgba(244, 255, 248, 0.76);
      font-size: 17px;
      line-height: 1.7;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .game-card {
      display: flex;
      min-height: 214px;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background:
        linear-gradient(150deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.04)),
        rgba(6, 17, 14, 0.74);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.28);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .game-card:focus-visible {
      outline: 3px solid rgba(125, 211, 252, 0.72);
      outline-offset: 4px;
    }

    .game-card:hover {
      transform: translateY(-3px);
      border-color: rgba(186, 247, 202, 0.48);
      background:
        linear-gradient(150deg, rgba(186, 247, 202, 0.16), rgba(125, 211, 252, 0.07)),
        rgba(6, 17, 14, 0.84);
    }

    .card-top {
      display: grid;
      gap: 12px;
    }

    .badge {
      width: fit-content;
      padding: 6px 9px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: #d9f99d;
      font-size: 12px;
      font-weight: 800;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .desc {
      margin: 0;
      color: rgba(244, 255, 248, 0.72);
      font-size: 14px;
      line-height: 1.62;
    }

    .open-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 26px;
      color: #7dd3fc;
      font-size: 14px;
      font-weight: 800;
    }

    .arrow {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.12);
      font-size: 20px;
    }

    @media (max-width: 720px) {
      body {
        display: block;
      }

      main {
        padding-top: 22px;
      }

      .game-grid {
        grid-template-columns: 1fr;
      }

      .game-card {
        min-height: 184px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Frog Game</p>
    <h1>选择要进入的青蛙游戏</h1>
    <p class="intro">这里保留原来 GitHub Pages 里的版本，也加入刚上传的模块化版本。两个入口互不覆盖，可以随时切换测试。</p>

    <section class="game-grid" aria-label="游戏入口">
      <a class="game-card" href="classic_game/">
        <span class="card-top">
          <span class="badge">原页面版本</span>
          <h2>青蛙守卫池塘 Mobile 稳定版</h2>
          <p class="desc">之前在主页直接打开的单文件版本，保留原来的移动端稳定体验。</p>
        </span>
        <span class="open-row">
          <span>进入旧版</span>
          <span class="arrow" aria-hidden="true">›</span>
        </span>
      </a>

      <a class="game-card" href="frog_game/">
        <span class="card-top">
          <span class="badge">v0.3 build 031</span>
          <h2>青蛙游戏新版</h2>
          <p class="desc">当前上传的项目目录版本，包含拆分后的配置、实体、系统、世界和 UI 文件。</p>
        </span>
        <span class="open-row">
          <span>进入新版</span>
          <span class="arrow" aria-hidden="true">›</span>
        </span>
      </a>
    </section>
  </main>
</body>
</html>
